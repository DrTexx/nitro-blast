[project]
name = "nitro-blast"
version = "0.1.0"
description = "Tool for unattended benchmarking"
readme = "README.md"
authors = [
    { name = "DrTexx", email = "23412100+DrTexx@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyinstaller>=6.22.3",
]

[project.scripts]
nitro-blast = "nitro_blast:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
